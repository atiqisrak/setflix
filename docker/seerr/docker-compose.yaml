# Seerr - Media request management (optional, for your media stack)
# Run: docker compose -f docker/seerr/docker-compose.yaml up -d
# Then open http://localhost:5055 and complete setup (Plex/Jellyfin + Radarr/Sonarr).
# Setflix does NOT stream from Seerr; Seerr is for requesting content. Playback in Setflix
# uses the catalog in data/movies.json and data/shows.json (or a future Plex/Jellyfin integration).

services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=info
      - TZ=UTC
      - PORT=5055
    ports:
      - "5055:5055"
    volumes:
      - seerr-config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped

volumes:
  seerr-config:
